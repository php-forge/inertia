<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Framework Agnostic</text>
        <text class="content" x="40" y="78">Plain PHP &#8226; Yii2 &#8226; Yii3 &#8226; Other adapters</text>
        <text class="content" x="40" y="98">No container, session, view, or HTTP framework dependency</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Protocol Results</text>
        <text class="content" x="630" y="78">Initial pages &#8226; Inertia pages &#8226; Redirects &#8226; Version conflicts</text>
        <text class="content" x="630" y="98">Neutral values expose status, headers, and page data</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Partial Reloads</text>
        <text class="content" x="40" y="198">Only &#8226; Except &#8226; Always &#8226; Optional &#8226; Dot notation</text>
        <text class="content" x="40" y="218">Lazy callbacks resolve only when selected</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Advanced Props</text>
        <text class="content" x="630" y="198">Deferred &#8226; Rescued &#8226; Merge &#8226; Deep merge &#8226; Once</text>
        <text class="content" x="630" y="218">Explicit metadata for client-side behavior</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Infinite Scroll</text>
        <text class="content" x="40" y="318">Append &#8226; Prepend &#8226; Match paths &#8226; Reset metadata</text>
        <text class="content" x="40" y="338">Pagination state remains framework neutral</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Safe Determinism</text>
        <text class="content" x="630" y="318">Immutable values &#8226; JSON validation &#8226; Injected clock</text>
        <text class="content" x="630" y="338">Long-running processes without global state</text>
    </g>
</svg>

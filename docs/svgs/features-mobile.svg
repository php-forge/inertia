<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 620" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Framework Agnostic</text>
        <text class="content" x="32" y="66">Plain PHP &#8226; Yii2 &#8226; Yii3 &#8226; Other adapters</text>
        <text class="content" x="32" y="84">No container, session, view, or HTTP framework dependency</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Protocol Results</text>
        <text class="content" x="32" y="166">Initial pages &#8226; Inertia pages &#8226; Redirects &#8226; Version conflicts</text>
        <text class="content" x="32" y="184">Neutral values expose status, headers, and page data</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Partial Reloads</text>
        <text class="content" x="32" y="266">Only &#8226; Except &#8226; Always &#8226; Optional &#8226; Dot notation</text>
        <text class="content" x="32" y="284">Lazy callbacks resolve only when selected</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">Advanced Props</text>
        <text class="content" x="32" y="366">Deferred &#8226; Rescued &#8226; Merge &#8226; Deep merge &#8226; Once</text>
        <text class="content" x="32" y="384">Explicit metadata for client-side behavior</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">Infinite Scroll</text>
        <text class="content" x="32" y="466">Append &#8226; Prepend &#8226; Match paths &#8226; Reset metadata</text>
        <text class="content" x="32" y="484">Pagination state remains framework neutral</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Safe Determinism</text>
        <text class="content" x="32" y="566">Immutable values &#8226; JSON validation &#8226; Injected clock</text>
        <text class="content" x="32" y="584">Long-running processes without global state</text>
    </g>
</svg>
